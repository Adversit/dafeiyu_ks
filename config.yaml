# ============================================================
# 快手大肥鱼 - DeepSeek 评论区自动回复机器人 配置
# 首次使用：先运行 `python -m app.main --login` 人工扫码登录，
#           登录态会持久化到 browser.user_data_dir。
# ============================================================

deepseek:
  api_key: "sk-xxxxxxxxxxxxxxxx"     # DeepSeek API Key（https://platform.deepseek.com）
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"             # deepseek-chat（V3）或 deepseek-reasoner（R1）
  temperature: 1.3
  max_tokens: 256                    # 单条回复最大 token
  timeout: 60

browser:
  headless: false                    # 首次登录必须 false；日常运行可保持 false
  user_data_dir: "data/chrome-profile"   # 持久化登录态目录（登录一次长期有效）
  slow_mo: 80                        # Playwright 操作慢放 ms，越接近真人
  default_timeout: 15000

creator:
  # 主源：作品前台评论区（支持文字 + emoji + 图片表情包回复）
  # 需要登录才能评论；登录后将作品页地址放这里，每轮轮询会逐条抓取新评论
  photo_urls:
    - "https://www.kuaishou.com/short-video/REPLACE_WITH_PHOTO_ID"
  # 可选源：快手创作者中心评论管理页（集中管理文字回复，不支持图片表情包）。
  # 若页面 DOM 结构与下方默认选择器不同，请按 README [DOM 校准指南] 调整 selectors
  creator_center_url: ""            # 留空则仅使用 photo_urls
  max_scrolls: 20                   # 单页最大滚动/翻页次数
  comment_sort: "newest"            # newest / hot（评论排序，快手段使用则忽略）

bot:
  persona: "ks_bro"                 # 人设：ks_bro / warm / professional / funny
  enabled: true
  auto_reply: true                  # 自动回复开关；false 时只抓取入库不发送
  poll_interval_seconds: 120        # 每轮抓取的间隔(秒)
  reply_interval_min: 20            # 相邻两次回复之间随机间隔(秒)下限
  reply_interval_max: 60            # 上限
  max_replies_per_hour: 10
  max_replies_per_day: 200
  filter_keywords: ["加微信", "加v", "广告", "私聊"]   # 命中则不回复
  trigger_keywords: []              # 非空时仅命中关键词的评论才回复（留空 = 全部）
  max_reply_length: 60              # 生成的回复最大字符数
  emoji: true                       # 允许 AI 在回复中使用 emoji
  sticker: true                     # 图片表情包：检测到上传框则附加图片；失败仅发文字
  sticker_path: "data/stickers/logo.png"   # 本地表情包图片，不存在且 sticker 打开时自动忽略

db:
  path: "data/bot.db"               # SQLite 数据文件

selectors:
  # 快手作品页评论区 DOM 选择器（快手改版后需按 README 校准）
  comment_item: ".comment-item"
  comment_user: "[class*=user]"
  comment_text: "[class*=content]"
  reply_btn: "text=/回复|回复【/"
  input_box: "div[contenteditable=true], textarea"
  send_btn: "text=发送"
  load_more_btn: "text=/查看更多|展开/"
  upload_input: "input[type=file]"

log:
  level: "INFO"
  file: "data/bot.log"
